<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Week 9 — Avatar</title>
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.1/lib/p5.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f8f6fa; }
    #avatar-stage {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #avatar-stage canvas { display: block; flex: none; width: 100vw !important; height: auto !important; }
    @media (orientation: landscape) {
      #avatar-stage canvas { width: auto !important; height: 100vh !important; height: 100dvh !important; }
    }
    h3, nav { position: fixed; z-index: 1; margin: 0; left: 12px; }
    h3 { top: 12px; font-family: "Comic Sans MS", "Comic Sans", cursive; }
    nav { bottom: 12px; font: 14px Arial, sans-serif; }
    nav a { color: #4d4658; }
  </style>
</head>
<body>
  <h3>Week 9</h3>
  <div id="avatar-load-status" style="position:fixed;left:12px;top:48px;z-index:10;max-width:50vw;background:#fff9;color:#4d4658;font:12px Arial;padding:4px;pointer-events:none">正在加载角色 · 手机版本 2</div>
  <main id="avatar-stage"></main>
  <nav><a href="../index.html">back to landing page</a></nav>
  <script>
    window.addEventListener("error", function (event) {
      const status = document.getElementById("avatar-load-status");
      if (status) status.textContent = "运行错误：" + (event.message || "脚本加载失败");
    });
    window.addEventListener("unhandledrejection", function (event) {
      const status = document.getElementById("avatar-load-status");
      if (status) status.textContent = "加载错误：" + (event.reason?.message || event.reason);
    });
  </script>
  <script src="sketch3.js?v=mobile-assets-2"></script>
</body>
</html>
